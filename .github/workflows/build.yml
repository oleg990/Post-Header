name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.v }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      # Go 1.20 — последняя версия, чьи .exe запускаются на Windows 7. Не повышать.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.20.14"

      - name: Версия
        id: ver
        # Релиз выходит сам, когда в main меняется файл VERSION
        # (или пушится тег v*): если тега vX ещё нет, он создаётся вместе с релизом.
        run: |
          V="dev-${GITHUB_SHA::7}"; R=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/}"; R=true
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == push ]]; then
            T="v$(tr -d ' \r\n' < VERSION)"
            if [[ -z "$(git ls-remote --tags origin "refs/tags/$T")" ]]; then V="$T"; R=true; fi
          fi
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "release=$R" >> "$GITHUB_OUTPUT"
          echo "Версия: $V, релиз: $R"

      - name: Vet and test
        run: |
          GOOS=windows go vet ./...
          go vet ./internal/render ./internal/config ./internal/fontscan ./internal/platform ./cmd/postheader-cli
          go test ./internal/render/... ./internal/update/... ./internal/spell/... ./internal/oracle/...

      - name: Build Windows exe (64 и 32 бита)
        run: |
          mkdir -p dist
          LDF="-s -w -X postheader/internal/ui.Version=${{ steps.ver.outputs.v }}"
          for A in amd64:win64 386:win32; do
            GOARCH=${A%%:*}; N=${A##*:}
            GOOS=windows GOARCH=$GOARCH go build -trimpath -ldflags="$LDF -H windowsgui" -o dist/PostHeader-$N.exe ./cmd/postheader
            GOOS=windows GOARCH=$GOARCH go build -trimpath -ldflags="$LDF" -o dist/postheader-cli-$N.exe ./cmd/postheader-cli
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: postheader-windows
          path: dist/*.exe

  installer:
    needs: build
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: postheader-windows
          path: dist

      # 6.2.2 — установщик запускается на Windows 7 SP1.
      - name: Inno Setup
        run: choco install innosetup --version=6.2.2 -y --no-progress --allow-downgrade

      - name: Сборка установщика
        shell: bash
        run: |
          V="${{ needs.build.outputs.version }}"; V="${V#v}"
          MSYS2_ARG_CONV_EXCL="*" "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=$V" installer/PostHeader.iss
          # копия с постоянным именем: ссылка .../releases/latest/download/PostHeader-Setup.exe всегда ведёт на свежую версию
          cp "dist/PostHeader-Setup-v$V.exe" dist/PostHeader-Setup.exe
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: postheader-setup
          path: dist/PostHeader-Setup-*.exe

      - name: Release
        if: needs.build.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: Post Header ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: NOTES.md
          files: dist/PostHeader-Setup*.exe
