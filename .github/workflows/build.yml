name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Go 1.20 — последняя версия, чьи .exe запускаются на Windows 7. Не повышать.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.20.14"

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Build Windows exe (64 и 32 бита)
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/postheader-cli-win64.exe ./cmd/postheader-cli
          GOOS=windows GOARCH=386   go build -trimpath -ldflags="-s -w" -o dist/postheader-cli-win32.exe ./cmd/postheader-cli

      - uses: actions/upload-artifact@v4
        with:
          name: postheader-windows
          path: dist/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
