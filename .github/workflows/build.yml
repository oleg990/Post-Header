name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Go 1.20 — последняя версия, чьи .exe запускаются на Windows 7. Не повышать.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.20.14"

      - name: Версия
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/}"; else V="dev-${GITHUB_SHA::7}"; fi
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - name: Vet and test
        run: |
          GOOS=windows go vet ./...
          go vet ./internal/render ./internal/config ./internal/fontscan ./internal/platform ./cmd/postheader-cli
          go test ./internal/render/...

      - name: Build Windows exe (64 и 32 бита)
        run: |
          mkdir -p dist
          LDF="-s -w -X postheader/internal/ui.Version=${{ steps.ver.outputs.v }}"
          for A in amd64:win64 386:win32; do
            GOARCH=${A%%:*}; N=${A##*:}
            GOOS=windows GOARCH=$GOARCH go build -trimpath -ldflags="$LDF -H windowsgui" -o dist/PostHeader-$N.exe ./cmd/postheader
            GOOS=windows GOARCH=$GOARCH go build -trimpath -ldflags="$LDF" -o dist/postheader-cli-$N.exe ./cmd/postheader-cli
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: postheader-windows
          path: dist/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
