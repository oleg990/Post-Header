name: web

# Веб-версия для телефона: тот же движок, собранный в WebAssembly, и страница
# из папки web/. Публикуется на GitHub Pages при каждом изменении.
on:
  push:
    branches: [main]
    paths: [web/**, cmd/postheader-web/**, internal/render/**, assets/**, VERSION, .github/workflows/web.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Сборка движка (WebAssembly)
        run: |
          mkdir -p site
          cp -r web/. site/
          GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o site/ph.wasm ./cmd/postheader-web
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" site/
          echo "$(cat VERSION) · веб ${GITHUB_SHA::7}" > site/version.txt
          ls -la site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
